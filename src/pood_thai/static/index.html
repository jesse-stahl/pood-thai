<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>พูดไทย · pood-thai</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section id="screen-topics" class="screen">
      <header>
        <h1>พูดไทย</h1>
        <p class="sub">Pick a topic and start talking.</p>
      </header>
      <div id="topics" class="topics"></div>
      <details id="memory-panel" class="memory">
        <summary>What I remember about you</summary>
        <ul id="memory-list"></ul>
        <p id="memory-empty" class="muted">Nothing yet. Have a chat first.</p>
      </details>
    </section>

    <section id="screen-chat" class="screen" hidden>
      <div class="stage">
        <div id="orb" class="orb" data-mode="idle"><span></span><span></span><span></span></div>
        <p id="status" class="status"></p>
        <p class="keys"><kbd>Space</kbd> Thai · <kbd>Shift</kbd>+<kbd>Space</kbd> English · <kbd>←</kbd><kbd>→</kbd> word · <kbd>↑</kbd><kbd>↓</kbd> speed · <kbd>Enter</kbd> play/pause · <kbd>R</kbd> replay · <kbd>⌫</kbd> undo · <kbd>T</kbd> transcript · <kbd>E</kbd> English</p>
      </div>
      <div id="player" class="player" hidden>
        <div class="player-row">
          <button id="btn-prev" type="button" title="Previous word (←)" aria-label="Previous word">⏮</button>
          <button id="btn-play" type="button" title="Play / pause (Enter)" aria-label="Play or pause">▶</button>
          <button id="btn-next" type="button" title="Next word (→)" aria-label="Next word">⏭</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position in reply">
          <span id="time" class="time">0.0s / 0.0s</span>
        </div>
        <div class="player-row">
          <label class="speed">Speed
            <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" aria-label="Speed">
            <span id="speed-label">1.00×</span>
          </label>
          <label id="voice-picker" class="voice" hidden>Voice <select id="voice"></select></label>
        </div>
      </div>
      <div class="controls">
        <button id="btn-replay" type="button">Replay</button>
        <button id="btn-undo" type="button">Undo</button>
        <button id="btn-transcript" type="button">Show transcript</button>
        <button id="btn-english" type="button">Hide English</button>
        <button id="btn-end" type="button" class="end">End</button>
      </div>
      <div id="transcript" class="transcript" hidden></div>
    </section>

    <div id="notice" class="notice" hidden></div>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>

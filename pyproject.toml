[project]
name = "pood-thai"
version = "0.1.0"
description = "Voice-only Thai conversation partner"
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.174",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mlx-whisper>=0.4.3",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pood_thai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real Whisper/Azure/Claude; run with -m live"]
addopts = "-m 'not live'"
